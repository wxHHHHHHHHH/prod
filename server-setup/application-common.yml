# ============================================
# 微服务通用配置 — Spring Cloud Alibaba
# 所有服务共享：Nacos / MySQL / Redis 地址
# 部署时复制到各服务的 resources 目录
# ============================================

spring:
  cloud:
    nacos:
      discovery:
        server-addr: 47.108.130.167:18848  # ← 服务器 Nacos 端口
        namespace: dev
      config:
        server-addr: 47.108.130.167:18848
        namespace: dev
        file-extension: yml
  datasource:
    url: jdbc:mysql://47.108.130.167:13306/mall?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}          # 环境变量，不要写死
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 47.108.130.167
      port: 16379
      password: ${REDIS_PASSWORD}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
