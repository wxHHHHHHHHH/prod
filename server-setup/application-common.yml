# ============================================
# 微服务通用配置 — 从环境变量读取
# 部署前 source ~/services/services-ports.env
# ============================================

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:47.108.130.167:8848}
      config:
        server-addr: ${NACOS_SERVER:47.108.130.167:8848}
        file-extension: yml
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://47.108.130.167:3306/mall}
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:47.108.130.167}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
