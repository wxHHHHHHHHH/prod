apiVersion: v1
kind: ConfigMap
metadata:
  name: mall-init-sql
  namespace: mall
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS mall CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    USE mall;

    CREATE TABLE IF NOT EXISTS mall_user (
      id BIGINT AUTO_INCREMENT PRIMARY KEY,
      username VARCHAR(50) NOT NULL UNIQUE,
      password VARCHAR(200) NOT NULL,
      nickname VARCHAR(50),
      phone VARCHAR(20),
      email VARCHAR(100),
      avatar VARCHAR(500),
      create_time DATETIME DEFAULT CURRENT_TIMESTAMP,
      update_time DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
      deleted TINYINT DEFAULT 0
    ) ENGINE=InnoDB;

    CREATE TABLE IF NOT EXISTS mall_product (
      id BIGINT AUTO_INCREMENT PRIMARY KEY,
      name VARCHAR(200) NOT NULL,
      description TEXT,
      price DECIMAL(10,2) NOT NULL,
      stock INT DEFAULT 0,
      image_url VARCHAR(500),
      category VARCHAR(50),
      status TINYINT DEFAULT 1,
      create_time DATETIME DEFAULT CURRENT_TIMESTAMP,
      update_time DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    ) ENGINE=InnoDB;

    CREATE TABLE IF NOT EXISTS mall_order (
      id BIGINT AUTO_INCREMENT PRIMARY KEY,
      order_no VARCHAR(64) NOT NULL UNIQUE,
      user_id BIGINT NOT NULL,
      product_id BIGINT NOT NULL,
      product_name VARCHAR(200),
      quantity INT NOT NULL,
      unit_price DECIMAL(10,2) NOT NULL,
      total_amount DECIMAL(10,2) NOT NULL,
      status VARCHAR(20) DEFAULT 'PENDING',
      pay_time DATETIME,
      create_time DATETIME DEFAULT CURRENT_TIMESTAMP,
      update_time DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    ) ENGINE=InnoDB;

    CREATE TABLE IF NOT EXISTS mall_payment (
      id BIGINT AUTO_INCREMENT PRIMARY KEY,
      pay_no VARCHAR(64) NOT NULL UNIQUE,
      order_id BIGINT NOT NULL,
      user_id BIGINT NOT NULL,
      amount DECIMAL(10,2) NOT NULL,
      pay_type VARCHAR(20) DEFAULT 'ALIPAY',
      status VARCHAR(20) DEFAULT 'PENDING',
      third_party_no VARCHAR(100),
      pay_time DATETIME,
      create_time DATETIME DEFAULT CURRENT_TIMESTAMP,
      update_time DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    ) ENGINE=InnoDB;

