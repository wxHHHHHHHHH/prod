# ============================================
# 服务器部署环境 profile
# ============================================
spring:
  config:
    import: optional:nacos:application-common.yml
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
        server-addr: ${NACOS_SERVER}
      discovery:
        server-addr: ${NACOS_SERVER}
  datasource:
    url: ${MYSQL_URL}
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
